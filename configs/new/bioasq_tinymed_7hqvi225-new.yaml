run_id: "7hqvi225-new"
description: "SumayyaAli/tiny-llama-1.1b-chat-medical (non-quantized) on BioASQ with multi-layer IS probing and BERTScore metric" 
base_output_dir: "./outputs/runs"

stages:
  generate: true
  compute_se: true
  probe_is: true
  train_hybrid_meta: true
  calculate_aurocs: true
  prepare_analysis: true
  evaluate_subtypes: true

dataset: "bioasq"
model_name: "SumayyaAli/tiny-llama-1.1b-chat-medical"
model_max_new_tokens: 50
quantization: null 

#--- Generation / SE Configuration (generate.py, compute_se.py) ---
seed: 10
num_few_shot: 15
temperature: 0.8
top_p: 0.8
enable_brief: true
brief_prompt: "default"
brief_always: false
use_context: false
num_generations: 10             
compute_accuracy_at_all_temps: true
metric: "bertscore"             
metric_threshold: 0.85          
entailment_model: "lighteternal/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext-finetuned-mnli" 
strict_entailment: true         
condition_on_question: true     
use_all_generations_se: true    
compute_p_true: true            
p_true_num_fewshot: 20
p_true_hint: false
num_samples: 400                

# --- Internal Signal Probe Configuration (probe.py) ---
probe_layers_to_extract: [-1, -2, -4] 
probe_classifier: "random_forest"     
probe_n_splits: 5                     
probe_seed: 42                        

# --- Hybrid Meta-Score Configuration (train_hybrid_meta.py) ---
meta_classifier: "logistic"      

# --- Data Preparation Configuration (create_analysis_dataset.py) ---
processed_annotation_dir: "./annotation_data"

# --- Analysis Configuration (calculate_aurocs.py, evaluate_subtypes.py) ---
analysis_score_columns:               
  - "semantic_entropy"
  - "naive_entropy"
  - "internal_signal_score"
  - "hybrid_simple_score"
  - "hybrid_meta_score"
analysis_min_samples_per_subtype: 2   
analysis_plot_dir_suffix: "subtype_plots_final" 
analysis_save_plots: true             
analysis_save_aurac_plots: true       