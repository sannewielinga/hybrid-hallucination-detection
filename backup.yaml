apiVersion: apps/v1
kind: Deployment
metadata:
  name: design
  namespace: design
  labels:
    app: design
spec:
  replicas: 1
  selector:
    matchLabels:
      app: design
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: design
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: design
          image: registry.gitlab.com/pieceofsht/crisp-portal/design:1.0.0-beta.0
          ports:
            - containerPort: 80
          imagePullPolicy: Always
          # envFrom:
          #   - configMapRef:
          #       name: web-config
          #   - secretRef:
          #       name: web-secrets
          # env:
          #   - name: NODE_ENV
          #     value: ${NODE_ENV}
          #   - name: BRAND
          #     value: 'Crisp'
          # readinessProbe:
          #   httpGet:
          #     path: /api/health
          #     port: 80
          #   initialDelaySeconds: 5
          #   periodSeconds: 15
          #   failureThreshold: 3
          #   successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: design-service
  namespace: design
spec:
  type: NodePort
  selector:
    app: design
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: design-tgb
  namespace: design
spec:
  serviceRef:
    name: design-service
    port: 80
  targetGroupARN: arn:aws:elasticloadbalancing:us-west-2:686040189881:targetgroup/eks-design/60d71c8f14df4efe
  targetType: ip
